# Integration Quality Scale tracking for s7plc.
#
# Audited against the official Home Assistant rule set on 2026-09-01:
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# This is a custom integration, so this checklist records progress only. It does
# not assign an official Home Assistant quality tier. A tier is reached only
# when every rule in that tier and all lower tiers is done or validly exempt.

rules:
  # Bronze
  action-setup:
    status: done
    comment: Actions are registered during integration setup and removed with the final config entry.
  appropriate-polling:
    status: done
    comment: The coordinator centralizes polling and supports configurable global and per-entity intervals.
  brands:
    status: todo
    comment: Local artwork is not an entry in the official home-assistant/brands repository.
  common-modules:
    status: done
    comment: Shared entity, coordinator, address, validation, and helper logic is kept in common modules.
  config-flow:
    status: done
    comment: The integration can be configured through the Home Assistant UI.
  config-flow-test-coverage:
    status: todo
    comment: Config-flow tests exist, but the required 100% flow coverage has not been demonstrated.
  dependency-transparency:
    status: done
    comment: The runtime dependency and exact version are declared in manifest.json.
  docs-actions:
    status: todo
    comment: The custom health_check and write_multi actions need complete end-user action documentation.
  docs-conditions:
    status: done
    comment: The integration provides no custom automation conditions, so there are none to document.
  docs-high-level-description:
    status: done
    comment: README.md describes the integration, supported PLC families, and its purpose.
  docs-installation-instructions:
    status: done
    comment: README.md contains HACS and manual installation instructions.
  docs-removal-instructions:
    status: todo
    comment: Entity removal is documented, but removal of the integration itself is not.
  docs-triggers:
    status: done
    comment: The integration provides no custom automation triggers, so there are none to document.
  entity-event-setup:
    status: done
    comment: Entity listeners use the entity lifecycle and coordinator listener management.
  entity-unique-id:
    status: done
    comment: Entities define stable unique IDs derived from the configured PLC and entity identity.
  has-entity-name:
    status: done
    comment: S7BaseEntity and the metrics entities enable has_entity_name.
  runtime-data:
    status: done
    comment: Config entries store a typed RuntimeEntryData instance in runtime_data.
  test-before-configure:
    status: done
    comment: The connection step validates PLC connectivity before creating the config entry.
  test-before-setup:
    status: done
    comment: Setup performs the coordinator's first refresh before forwarding platform setup.
  unique-config-entry:
    status: done
    comment: The config flow prevents duplicate PLC connection entries.

  # Silver
  action-exceptions:
    status: done
    comment: Action failures are surfaced as HomeAssistantError rather than swallowed.
  config-entry-unloading:
    status: done
    comment: async_unload_entry unloads platforms, shuts down the coordinator, and removes shared actions.
  docs-configuration-parameters:
    status: done
    comment: Configuration and entity parameters are described in docs/configuration.md.
  docs-installation-parameters:
    status: done
    comment: Connection type, address, rack/slot, TSAP, timeout, retry, and polling settings are documented.
  entity-unavailable:
    status: done
    comment: Entity availability follows coordinator connectivity and per-entity data availability.
  integration-owner:
    status: done
    comment: manifest.json declares an active code owner.
  log-when-unavailable:
    status: done
    comment: Coordinator failures use DataUpdateCoordinator's unavailable and recovery logging behavior.
  parallel-updates:
    status: done
    comment: Every polling entity platform declares an explicit PARALLEL_UPDATES value.
  reauthentication-flow:
    status: exempt
    comment: Siemens S7 connections configured by this integration do not use credentials or authentication tokens.
  test-coverage:
    status: todo
    comment: CI currently enforces 78.5%, below the rule's required coverage above 95% for every module.

  # Gold
  devices:
    status: done
    comment: Entities are grouped under a device representing the configured PLC.
  diagnostics:
    status: done
    comment: The integration implements config-entry diagnostics with sensitive data redaction.
  discovery:
    status: exempt
    comment: Generic S7 PLC endpoints do not advertise a supported Home Assistant discovery protocol.
  discovery-update-info:
    status: exempt
    comment: There is no supported discovery source from which an updated PLC address can be received.
  docs-data-update:
    status: done
    comment: Polling and global/per-entity scan intervals are documented.
  docs-examples:
    status: done
    comment: docs/examples.md provides setup and automation examples.
  docs-known-limitations:
    status: done
    comment: docs/troubleshooting.md documents protocol, connection, addressing, and performance limitations.
  docs-supported-devices:
    status: done
    comment: Supported Siemens PLC families and connection modes are documented.
  docs-supported-functions:
    status: done
    comment: Supported entity platforms and features are documented.
  docs-troubleshooting:
    status: done
    comment: docs/troubleshooting.md provides symptom-based troubleshooting steps.
  docs-use-cases:
    status: done
    comment: README.md and docs/examples.md describe representative PLC automation use cases.
  dynamic-devices:
    status: exempt
    comment: A configured PLC is one static device and does not dynamically add or remove child devices.
  entity-category:
    status: done
    comment: Connection and performance entities are categorized as diagnostic.
  entity-device-class:
    status: done
    comment: Applicable entities expose Home Assistant device classes from validated configuration.
  entity-disabled-by-default:
    status: exempt
    comment: User-created PLC entities are explicitly selected by the user; no noisy optional entities are auto-created.
  entity-translations:
    status: done
    comment: Integration-owned entity names use translation keys with localized resources.
  exception-translations:
    status: todo
    comment: User-facing HomeAssistantError messages still use hard-coded English strings.
  icon-translations:
    status: todo
    comment: Some integration-owned entities still set icons in Python and no icons.json is provided.
  reconfiguration-flow:
    status: todo
    comment: Options can be edited, but the config flow does not implement Home Assistant's reconfigure step.
  repair-issues:
    status: done
    comment: The integration creates a repair issue and repair flow for orphaned entity configuration.
  stale-devices:
    status: exempt
    comment: Each config entry represents one manually configured static PLC and cannot discover stale devices.

  # Platinum
  async-dependency:
    status: done
    comment: pys7 3.x provides the AsyncS7Client used by the coordinator.
  inject-websession:
    status: exempt
    comment: S7 uses a raw TCP protocol and does not create an HTTP client session.
  strict-typing:
    status: todo
    comment: Strict mypy compliance for the integration and its dependency has not been demonstrated.
